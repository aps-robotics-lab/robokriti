<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROBOKRITI Control</title><link rel="stylesheet" href="../css/style.css"></head><body class="admin-body"><div class="noise"></div><div id="login" class="login"><form id="login-form" class="login-box"><div class="eyebrow">Administrator only</div><h2 style="margin:18px 0">CONTROL<br>ROOM.</h2><div class="field"><label>Email</label><input id="email" type="email" value="ayusshh@outlook.in" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn primary" type="submit">Authenticate <span>↗</span></button><p id="login-error"></p></form></div><div id="app" class="admin" hidden><aside class="admin-side"><a class="brand" href="../index.html"><img src="../assets/awes-logo.png" alt="AWES"><i></i><span>ROBOKRITI</span></a><nav><button class="active" data-view="overview">Overview</button><button data-view="registrations">Registrations</button><button data-view="enquiries">Enquiries</button><button data-view="announcements">Announcements</button><button data-view="results">Results</button><button id="logout">Logout</button></nav></aside><main class="admin-main"><div id="view-overview" class="admin-view active"><div class="eyebrow">Administrator</div><h1 style="font-size:70px;margin:20px 0">CONTROL.</h1><div class="stats"><div class="stat"><b id="stat-reg">0</b><span class="mono">Registrations</span></div><div class="stat"><b id="stat-con">0</b><span class="mono">Enquiries</span></div><div class="stat"><b id="stat-ann">0</b><span class="mono">Announcements</span></div><div class="stat"><b id="stat-res">0</b><span class="mono">Results</span></div></div></div><div id="view-registrations" class="admin-view"><h2>Registrations</h2><button id="export-reg" class="btn" style="margin-top:20px">Export CSV <span>↓</span></button><table class="admin-table"><thead><tr><th>ID</th><th>Team</th><th>Event</th><th>Leader</th><th>Members</th><th>Status</th></tr></thead><tbody id="reg-table"></tbody></table></div><div id="view-enquiries" class="admin-view"><h2>Enquiries</h2><table class="admin-table"><thead><tr><th>Ticket</th><th>Name</th><th>Email</th><th>Subject</th><th>Status</th><th>Update</th></tr></thead><tbody id="con-table"></tbody></table></div><div id="view-announcements" class="admin-view"><h2>Publish announcement</h2><form id="ann-form" style="max-width:700px"><div class="field"><label>Title</label><input id="ann-title" required></div><div class="field"><label>Category</label><input id="ann-cat" value="UPDATE" required></div><div class="field"><label>Message</label><textarea id="ann-msg" required></textarea></div><button class="btn primary">Publish <span>↗</span></button></form><div id="ann-admin-list" style="margin-top:40px"></div></div><div id="view-results" class="admin-view"><h2>Publish result</h2><form id="res-form" style="max-width:700px"><div class="field"><label>Event</label><select id="res-event"><option>Robo Race</option><option>Robo Tug of War</option><option>Robo War</option><option>Robo Soccer</option></select></div><div class="grid-2"><div class="field"><label>Team A</label><input id="res-a" required></div><div class="field"><label>Team B</label><input id="res-b" required></div></div><div class="grid-2"><div class="field"><label>Score</label><input id="res-score" required></div><div class="field"><label>Winner</label><input id="res-winner" required></div></div><button class="btn primary">Publish result <span>↗</span></button></form><div id="res-admin-list" style="margin-top:40px"></div></div></main></div><div class="toast"></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script src="../js/firebase.js"></script><script src="admin.js"></script></body></html>
