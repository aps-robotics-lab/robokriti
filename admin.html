<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · ROBOKRITI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="css/style.css"></head><body><main class="content"><div class="wrap" style="max-width:1100px"><div id="login" class="form"><div class="eyebrow">ROBOKRITI / ADMIN</div><h2>CONTROL<br><i>ROOM.</i></h2><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn primary">AUTHENTICATE <span>↗</span></button><p id="loginStatus" class="mono"></p></form></div><div id="panel" style="display:none"><div class="sectionHead"><div><div class="eyebrow">ADMINISTRATOR</div><h2>MISSION<br><i>CONTROL.</i></h2></div><button id="logout" class="btn">SIGN OUT</button></div><div class="dataGrid"><div class="dataBox"><b id="regCount">0</b><span>REGISTRATIONS</span></div><div class="dataBox"><b id="msgCount">0</b><span>MESSAGES</span></div><div class="dataBox"><b id="annCount">0</b><span>ANNOUNCEMENTS</span></div><div class="dataBox"><b>01</b><span>ADMIN</span></div></div><section class="content"><div class="eyebrow">REGISTRATIONS</div><div style="overflow:auto"><table class="adminTable" id="regTable"></table></div><div class="eyebrow" style="margin-top:60px">ANNOUNCEMENT</div><form id="annForm" class="form"><div class="grid2"><div class="field"><label>Title</label><input name="title" required></div><div class="field"><label>Type</label><input name="type" value="INFO"></div></div><div class="field"><label>Body</label><textarea name="body" required></textarea></div><button class="btn primary">PUBLISH <span>↗</span></button></form></section></div></div></main><script type="module" src="js/admin.js"></script></body></html>
